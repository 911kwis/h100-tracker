name: Daily H100 Price Scraper

on:
  schedule:
    - cron: "0 12 * * *"   # Runs every day at 12:00 UTC (8am Eastern)
  workflow_dispatch:        # Allows manual trigger from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # Needed to commit CSV back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml pandas yfinance

      - name: Run scraper
        run: python scrape_to_csv.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "Auto-update: GPU + NVDA prices $(date +'%Y-%m-%d')"
          git push
